name: "RAG v3 Official Source Freshness"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  freshness-smoke:
    name: "Freshness Scheduler (Dry Run)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run official source freshness scheduler (dry-run)
        env:
          ENVIRONMENT: "production"
        run: |
          python scripts/official_source_freshness_scheduler.py \
            --registry ../docs/compliance/official-source-registry.json \
            --dry-run \
            --fail-on-error \
            --output official-source-freshness-scheduled-report.json

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-freshness-scheduled-report
          path: backend/official-source-freshness-scheduled-report.json
          retention-days: 30
